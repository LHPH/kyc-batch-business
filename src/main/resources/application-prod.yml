spring:
  datasource:
    url: ${kyc.config.database.postgresql.url}
    username: ${kyc.config.database.postgresql.username}
    password: ${kyc.config.database.postgresql.secret}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

kyc:
  batch:
    bills:
      chunk: 100
      taxes-amount: 16
      billing-start-day: 20
      billing-end-day: 20
      payment-due-day: 3

logging:
  file:
    name: /opt/kyc/logs/${spring.application.name}.log
    logback:
      rollingpolicy:
        file-name-pattern: /opt/kyc/logs/${spring.application.name}/%d{yyyy-MM-dd}.%i.log.gz
        max-file-size: 50MB
        max-history: 30
  level:
    root: INFO
    com.kyc: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.springframework.batch.item.data: INFO